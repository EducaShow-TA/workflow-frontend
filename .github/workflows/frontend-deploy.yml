name: Desplegar frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

# Un solo despliegue a la vez; si hay dos merges seguidos, se despliegan en orden.
concurrency:
  group: despliegue-frontend
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Probar y generar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Node 22 trae npm 10, que no acepta el package-lock.json generado con npm 11 (ver .npmrc).
      - name: Instalar npm 11
        run: npm install -g npm@11.16.0

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas
        run: npm test

      # SPA sin SSR: genera los estaticos en .output/public
      - name: Generar build
        run: npm run generate

      - name: Preparar artefacto
        run: tar -czf frontend.tar.gz -C .output/public .

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend.tar.gz
          retention-days: 30

  deploy:
    name: Desplegar en EC2
    needs: build
    runs-on: ubuntu-latest
    # El entorno solo admite la rama main y guarda la llave SSH y la huella del servidor.
    environment: produccion
    env:
      EC2_HOST: ${{ vars.EC2_HOST }}
      EC2_USER: ${{ vars.EC2_USER }}
    steps:
      - name: Descargar artefacto
        uses: actions/download-artifact@v4
        with:
          name: frontend-build

      # El servidor solo se enciende para las demos: si esta apagado, se omite el despliegue sin marcar error.
      - name: Verificar que el servidor este encendido
        id: servidor
        run: |
          if timeout 10 bash -c "</dev/tcp/${EC2_HOST}/22"; then
            echo "encendido=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Servidor apagado: despliegue omitido. Usa 'Run workflow' cuando lo enciendas."
            echo "encendido=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configurar SSH
        if: steps.servidor.outputs.encendido == 'true'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Enviar y desplegar
        if: steps.servidor.outputs.encendido == 'true'
        run: |
          scp -o BatchMode=yes frontend.tar.gz "${EC2_USER}@${EC2_HOST}:entrantes/frontend-${GITHUB_SHA}.tar.gz"
          ssh -o BatchMode=yes "${EC2_USER}@${EC2_HOST}" "sudo -n /opt/colegio/bin/desplegar-frontend.sh ${GITHUB_SHA}"
